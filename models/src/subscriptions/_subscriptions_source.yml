version: 2

sources:
  - name: testing_datalake
    description: >
      This source contains raw subscription-related data ingested into the testing data lake.
      It includes information on subscription lifecycles and pricing structures, capturing
      both subscription-level and item-level granularity. The data supports analytics around
      subscription activity, churn behavior, pricing plans, and purchase channels across
      different countries and currencies. 
    database: testing-project-454720

    tags: # tags applied to all source tables in this schema
      - "subscriptions"
      - "hourly"
      - "source"

    tables:
      - name: raw_subscriptions
        description: >
          Contains detailed records of individual subscriptions, including start and end dates,
          cancellation timestamps, purchase channels, and status. This table serves as the core
          reference for understanding user subscription behavior over time.
        tests:
          - dbt_utils.expression_is_true:
              expression: created_at <= cancelled_at
        columns:
          - name: id
            description: A unique identifier for each subscription.
            tests:
              - not_null
          - name: business_id
            description: FK mapping to the raw_business table.
            tests:
              - not_null
          - name: created_at
            description: The date and time when the subscription was created. The new subscription becomes active upon creation and remains so until it is canceled.
            tests:
              - not_null
          - name: current_term_start
            description: The start date of the current subscription term.
            tests:
              - not_null
          - name: current_term_end
            description: The end date of the current subscription term.
            tests:
              - not_null
          - name: cancel_schedule_created_at
            description: The date when the subscription cancellation was scheduled, if applicable.
          - name: cancelled_at
            description: The date when the subscription was cancelled, if applicable.
          - name: channel
            description: The channel through which the subscription was purchased (e.g., Apple App Store, Google Play Store).
            tests:
              - not_null
              - accepted_values:
                  values: ["web", "app_store", "play_store"]
          - name: status
            description: The current status of the subscription (e.g., active, cancelled).
            tests:
              - not_null
              - accepted_values:
                  values: ["cancelled", "non_renewing", "active"]
          - name: country
            description: In which country the subscription was created, aligns with business country.
            tests:
              - accepted_values:
                  values: ["CA", "US", null]
          - name: exchange_rate
            description: The exchange rate applied for currency conversion, if applicable.
          - name: subscription_plan
            description: The subscription plan ID and the currency code used in this subscription (e.g., USD, CAD).
            tests:
              - not_null

      - name: raw_subscription_items
        description: >
          Contains itemized data associated with each subscription, capturing plan-specific
          details such as billing frequency and pricing. This table enables pricing and plan
          mix analyses at a granular level.
        columns:
          - name: id
            description: Primary key representative of the raw_subscription_items table. Refers to one row per subscription item.
            tests:
              - unique
              - not_null
          - name: unit_type
            description: The subscription plan.
            tests:
              - not_null
              - accepted_values:
                  values: ["premium_monthly_web", "premium_monthly_iOS", "premium_monthly_android", "premium_annual_web", "premium_annual_iOS"]
          - name: billing_period_unit
            description: The unit of time for the billing period (month or year).
            tests:
              - not_null
              - accepted_values:
                  values: ["month", "year"]
          - name: unit_price
            description: The price charged at this subscription plan.
            tests:
              - not_null