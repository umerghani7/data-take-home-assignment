version: 2

sources:
  - name: testing_datalake
    description: >
      Contains records for individual businesses, including their country of operation,
      organizational structure, and classification types.
    database: testing-project-454720

    tags: # tags applied to all source tables in this schema
      - "business"
      - "hourly"
      - "source"

    tables:
      - name: raw_business
        description: >
          Contains records for individual businesses, including their country of operation,
          organizational structure, and classification types. This table is commonly joined
          with subscription data to support business-level analysis and reporting.
        columns:
          - name: id
            description: A unique identifier for each business record.
            tests:
              - not_null
          - name: create_date
            description: The date when the business record was created.
            tests:
              - not_null
          - name: country
            description: The country where the business is located.
            tests:
              - not_null
              - accepted_values:
                  values: ["us", "can"]
          - name: organizational_type
            description: The category of the organization's structure.
            tests:
              - not_null
              - accepted_values:
                  values: ["Corporation", "Limited Partnership", "Sole Proprietorship"]
          - name: type
            description: The primary classification of the business.
            tests:
              - not_null
          - name: subtype
            description: A more specific classification within the primary business type.
            tests:
              - not_null
