
name: 'hometask'
version: '1.0.0'

profile: 'hometask'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:        
  - "target"
  - "dbt_packages"


models:
  hometask:
    mart:
      +materialized: table
    stg:
      +materialized: view
      +tags: ["staging"] 

seeds:
  hometask:
    raw_subscriptions:
      file_format: csv
      delimiter: ","
      quote: '"'
      escape: '"'
      null_padding: true
